name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Deploy at most every 30 minutes. A newer push cancels a waiting run through
  # the concurrency group above, so the latest commit is the one that deploys.
  # Manual runs skip the wait.
  throttle:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Wait until 30 minutes after the last deploy
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/pages.yml/runs?status=success&branch=main&per_page=1" \
            --jq '.workflow_runs[0].updated_at // empty')
          if [ -n "$last" ]; then
            remaining=$(( 1800 - ($(date +%s) - $(date -d "$last" +%s)) ))
            if [ "$remaining" -gt 0 ]; then
              echo "Last deploy finished at $last, waiting ${remaining}s"
              sleep "$remaining"
            fi
          fi

  build:
    needs: throttle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
